name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - run: cmake --preset win-clang-release
      - run: cmake --build --preset win-clang-release
      - name: Комплект
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/win-clang-release/src/app/yo-gui.exe dist/
          Copy-Item build/win-clang-release/src/cli/yo-cli.exe dist/
          Copy-Item tests/data/yox.dat, tests/data/yo_regexpr.dat dist/
          Copy-Item README.md, NOTICE, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "yo-${{ github.ref_name }}-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: "yo-${{ github.ref_name }}-windows-x64.zip"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build
      - run: cmake --preset linux-clang-debug -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build --preset linux-clang-debug
      - name: Тесты перед публикацией
        run: ctest --test-dir build/linux-clang-debug --output-on-failure
      - name: Архив CLI
        run: |
          mkdir -p dist
          cp build/linux-clang-debug/src/cli/yo-cli dist/
          cp README.md NOTICE LICENSE dist/
          tar -czf "yo-${{ github.ref_name }}-linux-x86_64.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: "yo-${{ github.ref_name }}-linux-x86_64.tar.gz"

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Ё ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/windows/*.zip artifacts/linux/*.tar.gz
