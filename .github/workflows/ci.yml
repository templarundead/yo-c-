name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Abseil/RE2/Catch2/Benchmark качаются сюда, а не в каталог сборки:
  # так их можно кэшировать между прогонами.
  FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.deps

jobs:
  linux:
    name: Linux / clang 20, ASan+UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: LLVM 20 и ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y ninja-build

      - uses: actions/cache@v6
        with:
          path: .deps
          key: deps-linux-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}

      - name: Настройка
        run: cmake --preset linux-clang-debug -DCMAKE_CXX_COMPILER=clang++-20

      - name: Сборка
        run: cmake --build --preset linux-clang-debug

      - name: Тесты
        run: ctest --test-dir build/linux-clang-debug --output-on-failure

      - name: yo-cli собрался
        run: test -x build/linux-clang-debug/src/cli/yo-cli

      - uses: actions/upload-artifact@v4
        with:
          name: yo-cli-linux-x86_64
          path: build/linux-clang-debug/src/cli/yo-cli
          if-no-files-found: error

  windows-msvc:
    name: Windows / MSVC, тесты
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Окружение MSVC (Windows SDK, CRT)
        # Без этого cl.exe не в PATH, и CMake выбирает свалившийся рядом
        # MinGW-g++ — сборка «в MSVC-джобе» падала на collect2.exe.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/cache@v6
        with:
          path: .deps
          key: deps-windows-msvc-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}

      - name: Настройка (MSVC Release + тесты)
        # /WX для MSVC пока снят: набор /W4 у MSVC иной, чем clang-овый
        # -Wconversion/-Wold-style-cast, под который вылизан код, и MSVC этот
        # код ещё ни разу не собирал. Включать обратно — после триажа
        # предупреждений, чтобы не блокировать PR посторонними C4267/C4244.
        run: cmake --preset win-msvc-release -DYO_BUILD_TESTS=ON -DYO_WARNINGS_AS_ERRORS=OFF

      - name: Сборка
        shell: pwsh
        # Ошибки дублируем аннотациями: они доступны через API даже там, где
        # журнал джобы скачать нельзя.
        run: |
          cmake --build --preset win-msvc-release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log |
              Select-String -Pattern 'error C\d|error LNK\d|fatal error|undefined reference|ld returned|error:' |
              Select-Object -First 12 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Тесты
        run: ctest --test-dir build/win-msvc-release --output-on-failure

  windows-clang-cl:
    name: Windows / clang-cl, артефакты
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .deps
          key: deps-windows-clang-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}

      - name: Окружение MSVC (Windows SDK, CRT)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Настройка
        # clang-cl идёт в MSVC-режиме и получает /W4 вместо clang-овых
        # -Wconversion/-Wold-style-cast: этот профиль предупреждений в проекте
        # ещё не выверен, поэтому сборка артефактов идёт без /WX.
        run: cmake --preset win-clang-release -DYO_WARNINGS_AS_ERRORS=OFF

      - name: Сборка GUI и CLI
        shell: pwsh
        run: |
          cmake --build --preset win-clang-release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log |
              Select-String -Pattern 'error C\d|error LNK\d|fatal error|undefined reference|ld returned|error:' |
              Select-Object -First 12 |
              ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }

      - name: Комплект
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/win-clang-release/src/app/yo-gui.exe dist/
          Copy-Item build/win-clang-release/src/cli/yo-cli.exe dist/
          # Словари лежат рядом с exe — оттуда их ищет ensure_yoficator().
          Copy-Item tests/data/yox.dat, tests/data/yo_regexpr.dat dist/
          Copy-Item README.md, NOTICE, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath yo-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: yo-windows-x64
          path: yo-windows-x64.zip
          if-no-files-found: error

  windows-cross:
    name: Windows / кросс-сборка (zig, без Windows-SDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: zig и ninja
        run: |
          python3 -m pip install --break-system-packages ziglang
          # Каталог с исполняемым файлом zig ищем через сам пакет: pip может
          # положить его и в site-packages, и в ~/.local/bin.
          ZIG_DIR=$(python3 -c "import os, ziglang; print(os.path.dirname(ziglang.__file__))")
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build

      - name: Версии инструментов
        run: |
          zig version
          ninja --version
          cmake --version

      - name: Настройка
        run: >
          cmake -S . -B build/zig-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/zig-windows.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DYO_BUILD_GUI=ON -DYO_BUILD_CLI=ON -DYO_BUILD_TESTS=OFF

      - name: Сборка
        run: cmake --build build/zig-win

      - name: Это действительно PE-файл
        run: |
          file build/zig-win/src/app/yo-gui.exe | tee /dev/stderr | grep -q 'PE32+'
          file build/zig-win/src/cli/yo-cli.exe | grep -q 'PE32+'

      - uses: actions/upload-artifact@v4
        with:
          name: yo-windows-x64-zig
          path: |
            build/zig-win/src/app/yo-gui.exe
            build/zig-win/src/cli/yo-cli.exe
          if-no-files-found: error
